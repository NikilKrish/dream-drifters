name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm test

      - name: Build the Vercel release
        run: npm run build:vercel

      - name: Install release browsers
        run: npx playwright install --with-deps chrome firefox webkit

      - name: Run responsive browser checks
        run: npm run test:e2e
